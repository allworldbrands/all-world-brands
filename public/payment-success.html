<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To‘lov muvaffaqiyatli — ALL WORLD BRANDS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            color: #102a43;
        }

        .card {
            width: 100%;
            max-width: 430px;
            margin: 20px;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 60, 120, 0.12);
            text-align: center;
        }

        .check {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #dff8ea;
            color: #12a05c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 27px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .button {
            display: block;
            margin-top: 30px;
            padding: 15px;
            border-radius: 12px;
            background: #087ff0;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="check">✓</div>

    <h1>To‘lov muvaffaqiyatli!</h1>

    <p>
        ALL WORLD BRANDS uchun to‘lovingiz
        muvaffaqiyatli qabul qilindi.
    </p>

    <a href="/" class="button">
        Saytga qaytish
    </a>

</div>

</body>
</html>
