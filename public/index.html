<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALL WORLD BRANDS</title><style>
body{margin:0;font:16px system-ui;background:#f5f7fb;color:#182235}header{background:#101827;color:white;padding:18px 5%}.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between}.logo{font-weight:900}.logo span{color:#72a0ff}main{max-width:1200px;margin:auto;padding:40px 5%}h1{font-size:clamp(36px,6vw,64px);line-height:1.02}.search{display:flex;gap:10px;max-width:700px}.search input,input,select{padding:14px;border:1px solid #dfe4ec;border-radius:10px;flex:1}.btn{background:#215df2;color:white;border:0;padding:13px 18px;border-radius:10px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e1e6ee;border-radius:16px;padding:20px}.card{cursor:pointer}.muted{color:#6c7789;font-size:13px}.badge{background:#edf2ff;color:#2551bd;border-radius:20px;padding:5px 8px;font-size:11px}.hidden{display:none}.form{display:grid;gap:12px;max-width:650px}@media(max-width:600px){.search{flex-direction:column}}
</style></head><body><header><div class="nav"><div class="logo">ALL <span>WORLD BRANDS</span></div><div>allworldbrands.net</div></div></header><main>
<h1>Discover brands around the world.</h1><p class="muted">Countries → brands → factories → sources. Advertising and verification remain separate.</p>
<div class="search"><input id="q" placeholder="Search brand, country or category"><button class="btn" onclick="search()">Search</button></div><div id="results" class="panel hidden"></div>
<section id="countries"><h2>Countries</h2><div id="cg" class="grid"></div></section>
<section id="brands" class="hidden"><button class="btn" onclick="back()">← Countries</button><h2 id="ct"></h2><div id="bg" class="grid"></div><div id="detail" class="panel hidden"></div></section>
<section id="add"><h2>Add your brand</h2><div class="panel"><form class="form" onsubmit="apply(event)"><input id="bn" placeholder="Brand name" required><input id="co" placeholder="Country" required><input id="em" type="email" placeholder="Owner email" required><input id="web" placeholder="Official website"><select id="pk"><option>Basic</option><option>Business</option><option>Premium</option></select><button class="btn">Submit for review</button><div id="msg"></div></form></div></section></main>
<script>
const f={US:"🇺🇸",GB:"🇬🇧",DE:"🇩🇪",FR:"🇫🇷",IT:"🇮🇹",ES:"🇪🇸",TR:"🇹🇷",UZ:"🇺🇿",JP:"🇯🇵",KR:"🇰🇷",CN:"🇨🇳",IN:"🇮🇳",AE:"🇦🇪",SA:"🇸🇦",CA:"🇨🇦",AU:"🇦🇺",BR:"🇧🇷",MX:"🇲🇽",NL:"🇳🇱",CH:"🇨🇭",SE:"🇸🇪",NO:"🇳🇴",PL:"🇵🇱",SG:"🇸🇬",ID:"🇮🇩"};
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){let d=await fetch("/api/countries").then(r=>r.json());cg.innerHTML=d.map(c=>`<div class=card onclick="brands(${c.id},'${esc(c.name)}')"><div style="font-size:28px">${f[c.code]||"🌍"}</div><h3>${esc(c.name)}</h3></div>`).join("")} 
async function brands(id,n){countries.classList.add("hidden");brandsSection=true;document.getElementById("brands").classList.remove("hidden");ct.textContent=n;let d=await fetch("/api/countries/"+id+"/brands").then(r=>r.json());bg.innerHTML=d.map(b=>`<div class=card onclick="show(${b.id})"><h3>${esc(b.name)}</h3><p class=muted>${esc(b.category)}</p><span class=badge>${esc(b.verification)}</span></div>`).join("")}
async function show(id){let b=await fetch("/api/brands/"+id).then(r=>r.json());detail.classList.remove("hidden");detail.innerHTML=`<h2>${esc(b.name)}</h2><p>${esc(b.description)}</p><p><b>Country:</b> ${esc(b.country)}</p><p><b>Category:</b> ${esc(b.category)}</p><p><b>Verification:</b> ${esc(b.verification)}</p>${b.website?`<a href="${esc(b.website)}" target=_blank>Official website</a>`:""}<h3>Factories</h3><p class=muted>${b.factories.length?"Factory records will appear here as they are verified.":"No verified factory records yet."}</p>`}
function back(){document.getElementById("brands").classList.add("hidden");countries.classList.remove("hidden")}
async function search(){let qv=q.value.trim();if(!qv)return;let d=await fetch("/api/search?q="+encodeURIComponent(qv)).then(r=>r.json());results.classList.remove("hidden");results.innerHTML=d.map(b=>`<div style="padding:10px;border-bottom:1px solid #eee" onclick="show(${b.id})"><b>${esc(b.name)}</b> · ${esc(b.country)} · ${esc(b.category)}</div>`).join("")||"No results."}
async function apply(e){e.preventDefault();let r=await fetch("/api/applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({brand_name:bn.value,country:co.value,owner_email:em.value,website:web.value,package:pk.value})});let d=await r.json();msg.textContent=r.ok?"Application #"+d.id+" submitted for review.":d.error}
load();
</script></body></html>
