<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALL WORLD BRANDS — Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            color: #102a43;
        }

        .card {
            width: 100%;
            max-width: 430px;
            margin: 20px;
            padding: 35px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 60, 120, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #718096;
        }

        .price {
            margin: 25px 0;
            font-size: 42px;
            font-weight: 800;
            color: #087ff0;
        }

        .pay-button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: #087ff0;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay-button:hover {
            background: #066dcc;
        }

        #message {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>ALL WORLD BRANDS</h1>

    <div class="subtitle">
        Secure online payment
    </div>

    <div class="price">
        $1.00
    </div>

    <button
        class="pay-button"
        onclick="startPayment()"
    >
        To‘lash
    </button>

    <div id="message"></div>

</div>

<script>

async function startPayment() {

    const message =
        document.getElementById("message");

    message.textContent =
        "To‘lov sahifasi tayyorlanmoqda...";

    try {

        const response =
            await fetch("/api/payments/octo/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    amount: 1,
                    currency: "USD"
                })
            });

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Payment creation failed"
            );

        }

        if (!data.payment_url) {

            throw new Error(
                "OCTO payment URL was not returned"
            );

        }

        window.location.href =
            data.payment_url;

    } catch (error) {

        console.error(error);

        message.textContent =
            error.message ||
            "To‘lovni boshlashda xatolik yuz berdi.";

    }

}

</script>

</body>
</html>
