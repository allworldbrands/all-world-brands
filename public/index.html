<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL WORLD BRANDS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font:16px system-ui,-apple-system,Segoe UI,sans-serif;
 background:#f5f7fb;
 color:#182235
}

header{
 background:#101827;
 color:#fff;
 padding:18px 5%;
 position:sticky;
 top:0;
 z-index:10
}

.nav{
 max-width:1200px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:20px
}

.logo{
 font-weight:900;
 font-size:18px
}

.logo span{
 color:#72a0ff
}

main{
 max-width:1200px;
 margin:auto;
 padding:32px 5% 60px
}

h1{
 font-size:clamp(36px,6vw,64px);
 line-height:1.02;
 margin:10px 0
}

h2{
 margin-top:34px
}

.muted{
 color:#6c7789;
 font-size:14px
}

.search{
 display:flex;
 gap:10px;
 max-width:760px;
 margin:22px 0
}

.search input,
input,
select{
 padding:14px;
 border:1px solid #dfe4ec;
 border-radius:12px;
 flex:1;
 width:100%;
 font:inherit
}

.btn{
 background:#215df2;
 color:#fff;
 border:0;
 padding:13px 18px;
 border-radius:12px;
 font-weight:800;
 cursor:pointer
}

.btn:hover{
 opacity:.9
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:14px
}

.card,.panel{
 background:#fff;
 border:1px solid #e1e6ee;
 border-radius:16px;
 padding:18px
}

.card{
 cursor:pointer;
 transition:.15s;
 min-height:130px
}

.card:hover{
 transform:translateY(-2px);
 box-shadow:0 7px 22px rgba(0,0,0,.08)
}

.flag{
 font-size:42px;
 line-height:1;
 margin-bottom:12px
}

.country-name{
 font-size:17px;
 font-weight:800;
 margin-bottom:5px
}

.type{
 font-size:12px;
 color:#6c7789
}

.badge{
 background:#edf2ff;
 color:#2551bd;
 border-radius:20px;
 padding:5px 8px;
 font-size:11px
}

.price{
 font-size:32px;
 font-weight:900;
 margin:8px 0
}

.form{
 display:grid;
 gap:12px;
 max-width:650px
}

.hidden{
 display:none
}

.success{
 margin-top:10px;
 padding:12px;
 background:#eaf8ef;
 color:#18733a;
 border-radius:10px
}

.error{
 margin-top:10px;
 padding:12px;
 background:#fff0f0;
 color:#b42318;
 border-radius:10px
}

.back{
 margin-bottom:18px
}

.brand-card{
 cursor:pointer
}

.brand-card:hover{
 box-shadow:0 5px 20px rgba(0,0,0,.06)
}

.result-row{
 padding:12px;
 border-bottom:1px solid #eee;
 cursor:pointer
}

.result-row:last-child{
 border-bottom:0
}

.count{
 display:inline-block;
 margin-left:8px;
 background:#e9eef8;
 padding:4px 9px;
 border-radius:20px;
 font-size:12px
}

@media(max-width:600px){
 .nav{
  flex-direction:column;
  align-items:flex-start
 }

 .search{
  flex-direction:column
 }

 .search .btn{
  width:100%
 }

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
 }

 .card{
  padding:14px;
  min-height:120px
 }

 .flag{
  font-size:36px
 }

 .country-name{
  font-size:15px
 }
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">ALL <span>WORLD BRANDS</span></div>
<div>allworldbrands.net</div>
</div>
</header>

<main>

<h1>Discover brands around the world.</h1>

<p class="muted">
Countries, territories and dependencies — all in one world directory.
</p>

<div class="search">
<input
 id="q"
 placeholder="Search brand, country or territory"
 onkeydown="if(event.key==='Enter')searchBrands()"
>
<button class="btn" onclick="searchBrands()">Search</button>
</div>

<div id="results" class="panel hidden"></div>

<section id="countries">

<h2>
Countries & Territories
<span id="countryCount" class="count">0</span>
</h2>

<div id="cg" class="grid"></div>

</section>

<section id="brandsSection" class="hidden">

<button class="btn back" onclick="backToCountries()">
← Countries & Territories
</button>

<h2 id="ct"></h2>

<div id="bg" class="grid"></div>

<div
 id="detail"
 class="panel hidden"
 style="margin-top:20px"
></div>

</section>

<section id="add">

<h2>Add your brand</h2>

<div class="panel">

<p class="muted">
Submit your brand for review and listing.
</p>

<div class="price">$1.00</div>

<p class="muted">
One-time submission fee
</p>

<form class="form" onsubmit="apply(event)">

<input
 id="bn"
 placeholder="Brand name"
 required
>

<input
 id="co"
 placeholder="Country / Territory"
 required
>

<input
 id="em"
 type="email"
 placeholder="Owner email"
 required
>

<input
 id="ph"
 placeholder="Phone number"
>

<input
 id="web"
 placeholder="Official website"
>

<select id="pk">
<option value="Basic">
Basic — $1.00
</option>
</select>

<button
 class="btn"
 type="submit"
>
Submit for $1.00
</button>

<div id="msg"></div>

</form>

</div>

</section>

</main>

function flagFor(name){

 const code=codes[name];

 if(!code) return "🌍";

 return code
 .toUpperCase()
 .split("")
 .map(function(c){
  return String.fromCodePoint(
   127397+c.charCodeAt(0)
  );
 })
 .join("");

}

function esc(value){

 return String(value??"")
 .replace(/[&<>"']/g,function(m){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m];

 });

}

async function loadCountries(){

 try{

  const response=await fetch("/api/countries");
  const data=await response.json();

  document.getElementById("countryCount").textContent=data.length;

  document.getElementById("cg").innerHTML=data.map(function(c){

   return `
   <div
    class="card"
    onclick="loadBrands(${c.id}, '${esc(c.name)}')"
   >

    <div class="flag">
     ${flagFor(c.name)}
    </div>

    <div class="country-name">
     ${esc(c.name)}
    </div>

    <div class="type">
     ${codes[c.name]
       ?"Country / Territory"
       :"Region / territory"}
    </div>

   </div>`;

  }).join("");

 }catch(error){

  console.error(error);

 }

}

async function loadBrands(id,countryName){

 document.getElementById("countries")
 .classList.add("hidden");

 document.getElementById("add")
 .classList.add("hidden");

 document.getElementById("brandsSection")
 .classList.remove("hidden");

 document.getElementById("ct").innerHTML=
 `${flagFor(countryName)} ${esc(countryName)}`;

 try{

  const response=
   await fetch("/api/countries/"+id+"/brands");

  const data=await response.json();

  document.getElementById("bg").innerHTML=
   data.length

   ?

   data.map(function(b){

    return `
    <div
     class="card brand-card"
     onclick="showBrand(${b.id})"
    >

     <h3>${esc(b.name)}</h3>

     <span class="badge">
      Brand
     </span>

    </div>`;

   }).join("")

   :

   `<div class="panel">
    No brands listed yet.
   </div>`;

 }catch(error){

  console.error(error);

 }

}

async function showBrand(id){

 try{

  const response=
   await fetch("/api/brands/"+id);

  const b=await response.json();

  const detail=
   document.getElementById("detail");

  detail.classList.remove("hidden");

  detail.innerHTML=`

   <h2>
    ${esc(b.name)}
   </h2>

   <p>
    ${esc(
     b.description||
     "No description available."
    )}
   </p>

   <p>
    <b>Country:</b>
    ${flagFor(b.country_name||"")}
    ${esc(b.country_name||"")}
   </p>

   ${
    b.website

    ?

    `<p>
      <a
       href="${esc(b.website)}"
       target="_blank"
       rel="noopener"
      >
       Official website
      </a>
     </p>`

    :

    ""
   }

  `;

 }catch(error){

  console.error(error);

 }

}

function backToCountries(){

 document.getElementById("brandsSection")
 .classList.add("hidden");

 document.getElementById("countries")
 .classList.remove("hidden");

 document.getElementById("add")
 .classList.remove("hidden");

 document.getElementById("detail")
 .classList.add("hidden");

}

async function searchBrands(){

 const value=
  document.getElementById("q")
  .value
  .trim();

 if(!value)return;

 try{

  const response=
   await fetch(
    "/api/search?q="+
    encodeURIComponent(value)
   );

  const data=await response.json();

  const results=
   document.getElementById("results");

  results.classList.remove("hidden");

  results.innerHTML=

   data.length

   ?

   data.map(function(b){

    return `
    <div
     class="result-row"
     onclick="showBrand(${b.id})"
    >

     <b>
      ${flagFor(b.country_name||"")}
      ${esc(b.name)}
     </b>

     · ${esc(b.country_name||"")}

    </div>`;

   }).join("")

   :

   "No results.";

 }catch(error){

  console.error(error);

 }

}

async function apply(event){

 event.preventDefault();

 const msg=
  document.getElementById("msg");

 msg.className="";
 msg.textContent="Sending...";

 const data={

  name:
   document.getElementById("bn").value,

  email:
   document.getElementById("em").value,

  phone:
   document.getElementById("ph").value,

  message:

   "Brand: "+
   document.getElementById("bn").value+

   "\nCountry: "+
   document.getElementById("co").value+

   "\nWebsite: "+
   document.getElementById("web").value+

   "\nPackage: "+
   document.getElementById("pk").value+

   "\nPrice: $1.00"

 };

 try{

  const response=
   await fetch(
    "/api/applications",
    {
     method:"POST",
     headers:{
      "Content-Type":
      "application/json"
     },
     body:JSON.stringify(data)
    }
   );

  const result=
   await response.json();

  if(response.ok){

   msg.className="success";

   msg.textContent=
    "Application #"+
    result.id+
    " submitted successfully.";

   event.target.reset();

  }else{

   msg.className="error";

   msg.textContent=
    result.error||
    "Something went wrong.";

  }

 }catch(error){

  console.error(error);

  msg.className="error";

  msg.textContent=
   "Connection error. Please try again.";

 }

}
