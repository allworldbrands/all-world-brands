<!doctype html>
<html lang="en">

<title>ALL WORLD BRANDS</title>

<style>

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font:
    16px
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 0%,
      #e7efff 0,
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 10%,
      #f0e9ff 0,
      transparent 28%
    ),
    #f5f7fb;

  color:#182235;
}


/* =========================
   HEADER
========================= */

header{

  background:
    linear-gradient(
      135deg,
      #07111f,
      #101827 45%,
      #172b52
    );

  color:#fff;

  padding:18px 5%;

  position:sticky;
  top:0;

  z-index:100;

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);
}

.nav{

  max-width:1200px;

  margin:auto;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;
}

.logo{

  font-size:20px;

  font-weight:950;

  letter-spacing:.4px;
}

.logo span{

  color:#72a0ff;

  text-shadow:
    0 0 18px
    rgba(114,160,255,.5);
}

.domain{

  color:#c8d4ea;

  font-size:13px;

  font-weight:600;
}


/* =========================
   MAIN
========================= */

main{

  max-width:1200px;

  margin:auto;

  padding:
    42px 5% 70px;
}


/* =========================
   HERO
========================= */

.hero{

  position:relative;

  overflow:hidden;

  padding:
    20px 0 10px;
}

.hero::before{

  content:"";

  position:absolute;

  width:280px;
  height:280px;

  right:-100px;
  top:-120px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(54,105,255,.16),
      transparent 68%
    );

  pointer-events:none;
}

h1{

  position:relative;

  font-size:
    clamp(38px,6vw,70px);

  line-height:1.02;

  letter-spacing:-2px;

  margin:
    10px 0 16px;

  max-width:900px;

  background:
    linear-gradient(
      135deg,
      #111827,
      #245df5,
      #7c3aed
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}

h2{

  margin-top:38px;

  margin-bottom:16px;

  font-size:28px;

  letter-spacing:-.5px;
}

.muted{

  color:#6c7789;

  font-size:15px;

  line-height:1.6;
}


/* =========================
   SEARCH
========================= */

.search{

  display:flex;

  gap:10px;

  max-width:800px;

  margin:
    28px 0 30px;
}

.search input{

  flex:1;
}


/* =========================
   INPUTS
========================= */

.search input,
input,
select{

  padding:15px 16px;

  border:
    1px solid
    #dce3ee;

  border-radius:14px;

  width:100%;

  font:inherit;

  background:
    rgba(255,255,255,.92);

  color:#182235;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;
}

.search input:focus,
input:focus,
select:focus{

  border-color:#6b8ff8;

  box-shadow:
    0 0 0 4px
    rgba(66,103,240,.1);
}


/* =========================
   BUTTON
========================= */

.btn{

  background:
    linear-gradient(
      135deg,
      #215df2,
      #5738e8
    );

  color:#fff;

  border:0;

  padding:
    14px 20px;

  border-radius:14px;

  font-weight:850;

  cursor:pointer;

  box-shadow:
    0 8px 20px
    rgba(43,83,220,.22);

  transition:
    transform .2s,
    box-shadow .2s,
    opacity .2s;
}

.btn:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 12px 26px
    rgba(43,83,220,.3);

  opacity:.96;
}

.btn:active{

  transform:
    translateY(0);
}


/* =========================
   PANEL
========================= */

.panel{

  background:
    rgba(255,255,255,.9);

  border:
    1px solid
    rgba(220,226,238,.95);

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 10px 30px
    rgba(30,45,75,.06);
}


/* =========================
   GRID
========================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px,1fr)
    );

  gap:16px;
}


/* =====================================================
   BEAUTIFUL COUNTRY CARDS
===================================================== */

.country-card{

  position:relative;

  overflow:hidden;

  min-height:180px;

  padding:0;

  border-radius:22px;

  cursor:pointer;

  border:
    1px solid
    rgba(255,255,255,.18);

  background:#111827;

  box-shadow:
    0 12px 32px
    rgba(20,30,55,.18);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}


/* colourful background */

.country-card::before{

  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle at 15% 15%,
      var(--c1),
      transparent 42%
    ),
    radial-gradient(
      circle at 90% 20%,
      var(--c2),
      transparent 45%
    ),
    linear-gradient(
      135deg,
      var(--c3),
      var(--c4)
    );

  opacity:1;

  z-index:0;

  transition:
    transform .5s ease,
    opacity .3s ease;
}


/* shine */

.country-card::after{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-70px;
  top:-75px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.3),
      transparent 68%
    );

  filter:blur(5px);

  z-index:1;

  transition:
    transform .4s ease;
}


/* dark overlay */

.country-overlay{

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.02) 0%,
      rgba(0,0,0,.10) 30%,
      rgba(0,0,0,.88) 100%
    );

  z-index:2;
}


/* content */

.country-content{

  position:relative;

  z-index:3;

  min-height:180px;

  padding:18px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;
}


/* flag */

.country-flag{

  font-size:46px;

  line-height:1;

  filter:
    drop-shadow(
      0 5px 8px
      rgba(0,0,0,.35)
    );

  transition:
    transform .3s ease;
}


/* bottom */

.country-info{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:10px;
}


/* name */

.country-name{

  color:#fff;

  font-size:16px;

  font-weight:900;

  line-height:1.2;

  text-shadow:
    0 2px 9px
    rgba(0,0,0,.8);
}


/* code */

.country-code{

  display:inline-flex;

  margin-top:8px;

  padding:
    4px 9px;

  border-radius:20px;

  background:
    rgba(0,0,0,.32);

  border:
    1px solid
    rgba(255,255,255,.2);

  color:#fff;

  font-size:10px;

  font-weight:800;

  backdrop-filter:
    blur(7px);
}


/* label */

.country-label{

  white-space:nowrap;

  color:#fff;

  font-size:10px;

  font-weight:800;

  background:
    rgba(0,0,0,.32);

  border:
    1px solid
    rgba(255,255,255,.16);

  padding:
    7px 9px;

  border-radius:20px;

  backdrop-filter:
    blur(8px);

  text-shadow:
    0 1px 4px
    rgba(0,0,0,.5);
}


/* hover */

.country-card:hover{

  transform:
    translateY(-7px)
    scale(1.01);

  border-color:
    rgba(115,160,255,.65);

  box-shadow:
    0 22px 48px
    rgba(15,25,50,.3),
    0 0 28px
    rgba(55,105,255,.1);
}

.country-card:hover::before{

  transform:
    scale(1.12);
}

.country-card:hover::after{

  transform:
    translate(-15px,15px)
    scale(1.15);
}

.country-card:hover .country-flag{

  transform:
    scale(1.1)
    rotate(-2deg);
}


/* =========================
   BADGE
========================= */

.badge{

  display:inline-block;

  background:#edf2ff;

  color:#2551bd;

  border-radius:20px;

  padding:
    5px 9px;

  font-size:11px;

  font-weight:800;
}


/* =========================
   COUNT
========================= */

.count{

  display:inline-block;

  margin-left:8px;

  background:
    #e9eef8;

  color:#43516b;

  padding:
    5px 10px;

  border-radius:20px;

  font-size:12px;

  font-weight:800;
}


/* =========================
   BRAND CARDS
========================= */

.brand-card{

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f7f9ff
    );

  transition:
    transform .2s,
    box-shadow .2s;
}

.brand-card:hover{

  transform:
    translateY(-4px);

  box-shadow:
    0 12px 28px
    rgba(0,0,0,.09);
}


/* =========================
   PRICE
========================= */

.price{

  font-size:36px;

  font-weight:950;

  margin:
    8px 0;

  background:
    linear-gradient(
      135deg,
      #215df2,
      #713bea
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;
}


/* =========================
   FORM
========================= */

.form{

  display:grid;

  gap:13px;

  max-width:650px;
}


/* =========================
   RESULT
========================= */

.result-row{

  padding:14px;

  border-bottom:
    1px solid
    #edf0f5;

  cursor:pointer;

  border-radius:10px;

  transition:
    background .2s;
}

.result-row:hover{

  background:#f5f7ff;
}

.result-row:last-child{

  border-bottom:0;
}


/* =========================
   MESSAGES
========================= */

.success{

  margin-top:10px;

  padding:13px;

  background:#eaf8ef;

  color:#18733a;

  border-radius:12px;

  font-weight:650;
}

.error{

  margin-top:10px;

  padding:13px;

  background:#fff0f0;

  color:#b42318;

  border-radius:12px;

  font-weight:650;
}


/* =========================
   BACK
========================= */

.back{

  margin-bottom:18px;
}


/* =========================
   HIDDEN
========================= */

.hidden{

  display:none !important;
}


/* =========================
   ADD SECTION
========================= */

#add{

  margin-top:50px;
}

#add .panel{

  max-width:850px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.98),
      rgba(242,246,255,.96)
    );
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{

    padding:
      15px 5%;
  }

  .nav{

    flex-direction:column;

    align-items:flex-start;

    gap:5px;
  }

  .logo{

    font-size:18px;
  }

  .domain{

    font-size:11px;
  }

  main{

    padding:
      28px 4% 55px;
  }

  h1{

    font-size:
      clamp(38px,12vw,55px);

    letter-spacing:-1.5px;
  }

  h2{

    font-size:23px;
  }

  .search{

    flex-direction:column;

    margin-top:22px;
  }

  .search .btn{

    width:100%;
  }

  .grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:11px;
  }

  .country-card{

    min-height:160px;

    border-radius:18px;
  }

  .country-content{

    min-height:160px;

    padding:14px;
  }

  .country-flag{

    font-size:35px;
  }

  .country-name{

    font-size:13px;
  }

  .country-code{

    font-size:9px;

    padding:
      3px 7px;
  }

  .country-label{

    font-size:8px;

    padding:
      6px 7px;
  }

  .panel{

    padding:16px;

    border-radius:17px;
  }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

  .grid{

    gap:8px;
  }

  .country-card{

    min-height:150px;
  }

  .country-content{

    min-height:150px;

    padding:12px;
  }

  .country-flag{

    font-size:31px;
  }

  .country-name{

    font-size:12px;
  }

  .country-label{

    display:none;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="nav">

    <div class="logo">
      ALL <span>WORLD BRANDS</span>
    </div>

    <div class="domain">
      allworldbrands.net
    </div>

  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Discover brands
      around the world.
    </h1>

    <p class="muted">
      Countries, territories and dependencies —
      all in one world directory.
    </p>

  </section>


  <!-- SEARCH -->

  <div class="search">

    <input
      id="q"
      placeholder="Search brand, country or territory"
      onkeydown="
        if(event.key==='Enter')
        searchBrands()
      "
    >

    <button
      class="btn"
      onclick="searchBrands()"
    >
      Search
    </button>

  </div>


  <!-- SEARCH RESULTS -->

  <div
    id="results"
    class="panel hidden"
  ></div>


  <!-- =========================
       COUNTRIES
  ========================= -->

  <section id="countries">

    <h2>

      Countries & Territories

      <span
        id="countryCount"
        class="count"
      >
        0
      </span>

    </h2>


    <div
      id="cg"
      class="grid"
    ></div>

  </section>


  <!-- =========================
       BRANDS
  ========================= -->

  <section
    id="brandsSection"
    class="hidden"
  >

    <button
      class="btn back"
      onclick="backToCountries()"
    >
      ← Countries & Territories
    </button>


    <h2 id="ct"></h2>


    <div
      id="bg"
      class="grid"
    ></div>


    <div
      id="detail"
      class="panel hidden"
      style="margin-top:20px"
    ></div>

  </section>


  <!-- =========================
       ADD BRAND
  ========================= -->

  <section id="add">

    <h2>
      Add your brand
    </h2>


    <div class="panel">

      <p class="muted">
        Submit your brand for review and listing.
      </p>


      <div class="price">
        $1.00
      </div>


      <p class="muted">
        One-time submission fee
      </p>


      <form
        class="form"
        onsubmit="apply(event)"
      >


        <input
          id="bn"
          placeholder="Brand name"
          required
        >


        <input
          id="co"
          placeholder="Country / Territory"
          required
        >


        <input
          id="em"
          type="email"
          placeholder="Owner email"
          required
        >


        <input
          id="ph"
          placeholder="Phone number"
        >


        <input
          id="web"
          placeholder="Official website"
        >


        <select id="pk">

          <option value="Basic">
            Basic — $1.00
          </option>

        </select>


        <button
          class="btn"
          type="submit"
        >
          Submit for $1.00
        </button>


        <div id="msg"></div>


      </form>

    </div>

  </section>


</main>

/* =========================
   FLAG
========================= */

function flagFor(name){

  const code=codes[name];

  if(!code){

    return "🌍";

  }

  return code
    .toUpperCase()
    .split("")
    .map(function(c){

      return String.fromCodePoint(
        127397 +
        c.charCodeAt(0)
      );

    })
    .join("");

}


/* =========================
   ESCAPE
========================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[m];

      }
    );

}

/* =========================
   SHOW BRAND
========================= */

async function showBrand(id){

  try{

    const response =
      await fetch(
        "/api/brands/" + id
      );


    const b =
      await response.json();


    const detail =
      document.getElementById(
        "detail"
      );


    detail.classList.remove(
      "hidden"
    );


    detail.innerHTML = `

      <h2>
        ${esc(b.name)}
      </h2>


      <p>
        ${esc(
          b.description ||
          "No description available."
        )}
      </p>


      <p>

        <b>Country:</b>

        ${flagFor(
          b.country_name || ""
        )}

        ${esc(
          b.country_name || ""
        )}

      </p>


      ${
        b.website

        ?

        `

          <p>

            <a
              href="${esc(b.website)}"
              target="_blank"
              rel="noopener"
            >
              Official website
            </a>

          </p>

        `

        :

        ""

      }

    `;


    detail.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  }catch(error){

    console.error(error);

  }

}

/* =========================
   SEARCH
========================= */

async function searchBrands(){

  const value =
    document
      .getElementById("q")
      .value
      .trim();


  if(!value){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/search?q=" +
        encodeURIComponent(value)
      );


    const data =
      await response.json();


    const results =
      document.getElementById(
        "results"
      );


    results.classList.remove(
      "hidden"
    );


    results.innerHTML =

      data.length

      ?

      data.map(
        function(b){

          return `

            <div
              class="result-row"
              onclick="
                showBrand(${b.id})
              "
            >

              <b>

                ${flagFor(
                  b.country_name || ""
                )}

                ${esc(b.name)}

              </b>

              ·

              ${esc(
                b.country_name || ""
              )}

            </div>

          `;

        }
      ).join("")

      :

      `

        <div class="muted">
          No results found.
        </div>

      `;


  }catch(error){

    console.error(error);

  }

}


/* =========================
   APPLY / ADD BRAND
========================= */

async function apply(event){

  event.preventDefault();


  const msg =
    document.getElementById(
      "msg"
    );


  msg.className="";

  msg.textContent=
    "Sending...";


  const data={

    name:
      document.getElementById(
        "bn"
      ).value,

    email:
      document.getElementById(
        "em"
      ).value,

    phone:
      document.getElementById(
        "ph"
      ).value,

    message:

      "Brand: " +

      document.getElementById(
        "bn"
      ).value +

      "\nCountry: " +

      document.getElementById(
        "co"
      ).value +

      "\nWebsite: " +

      document.getElementById(
        "web"
      ).value +

      "\nPackage: " +

      document.getElementById(
        "pk"
      ).value +

      "\nPrice: $1.00"

  };


  try{

    const response =
      await fetch(
        "/api/applications",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)

        }
      );


    const result =
      await response.json();


    if(response.ok){

      msg.className=
        "success";


      msg.textContent =
        "Application #" +
        result.id +
        " submitted successfully.";


      event.target.reset();


    }else{

      msg.className=
        "error";


      msg.textContent =
        result.error ||
        "Something went wrong.";

    }


  }catch(error){

    console.error(error);


    msg.className=
      "error";


    msg.textContent =
      "Connection error. Please try again.";

  }

}
