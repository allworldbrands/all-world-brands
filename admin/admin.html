<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALL WORLD BRANDS — Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: 0.75;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card strong {
      display: block;
      font-size: 30px;
      margin-top: 8px;
    }

    section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 8px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .refresh {
      background: #374151;
      color: white;
    }

    .brand {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
    }

    .brand h3 {
      margin: 0 0 5px;
    }

    .brand p {
      margin: 5px 0;
      color: #555;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      section {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 ALL WORLD BRANDS</h1>
  <p>Admin Control Panel</p>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- DASHBOARD -->

  <div class="cards">

    <div class="card">
      🌍 Countries
      <strong id="countryCount">0</strong>
    </div>

    <div class="card">
      🏷️ Brands
      <strong id="brandCount">0</strong>
    </div>

    <div class="card">
      📩 Applications
      <strong id="applicationCount">0</strong>
    </div>

  </div>

  <!-- ADD BRAND -->

  <section>

    <h2>➕ Add New Brand</h2>

    <input
      id="brandName"
      type="text"
      placeholder="Brand name"
    >

    <input
      id="countryCode"
      type="text"
      placeholder="Country code e.g. UZ, US, GB"
      maxlength="2"
    >

    <input
      id="category"
      type="text"
      placeholder="Category"
    >

    <textarea
      id="description"
      placeholder="Brand description"
    ></textarea>

    <input
      id="website"
      type="url"
      placeholder="Website"
    >

    <select id="verification">
      <option value="Unverified">Unverified</option>
      <option value="Official source">Official source</option>
      <option value="Verified">Verified</option>
    </select>

    <button
      class="primary"
      onclick="addBrand()"
    >
      Add Brand
    </button>

  </section>

  <!-- BRANDS -->

  <section>

    <h2>🏷️ Brands</h2>

    <button
      class="refresh"
      onclick="loadBrands()"
    >
      🔄 Refresh Brands
    </button>

    <input
      id="search"
      type="search"
      placeholder="Search brands..."
      oninput="filterBrands()"
    >

    <div id="brands">
      Loading...
    </div>

  </section>

  <!-- APPLICATIONS -->

  <section>

    <h2>📩 Applications</h2>

    <button
      class="refresh"
      onclick="loadApplications()"
    >
      🔄 Refresh Applications
    </button>

    <div id="applications">
      Loading...
    </div>

  </section>

</div>

<script>

let allBrands = [];

// ================= MESSAGE =================

function showMessage(text, type) {

  const box = document.getElementById("message");

  box.textContent = text;

  box.className = "message " + type;

  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 4000);
}

// ================= COUNTRIES =================

async function loadCountries() {

  try {

    const response = await fetch("/api/countries");

    const countries = await response.json();

    document.getElementById("countryCount").textContent =
      countries.length;

  } catch (error) {

    console.error(error);

  }
}

// ================= BRANDS =================

async function loadBrands() {

  const container =
    document.getElementById("brands");

  container.innerHTML = "Loading...";

  try {

    const response =
      await fetch("/api/admin/brands");

    if (!response.ok) {
      throw new Error("Failed to load brands");
    }

    allBrands = await response.json();

    document.getElementById("brandCount").textContent =
      allBrands.length;

    displayBrands(allBrands);

  } catch (error) {

    container.innerHTML =
      "<p>❌ Could not load brands.</p>";

    console.error(error);

  }
}

// ================= DISPLAY BRANDS =================

function displayBrands(brands) {

  const container =
    document.getElementById("brands");

  if (!brands.length) {

    container.innerHTML =
      "<p>No brands found.</p>";

    return;
  }

  container.innerHTML = "";

  brands.forEach(brand => {

    const div =
      document.createElement("div");

    div.className = "brand";

    div.innerHTML = `
      <h3>${escapeHtml(brand.name)}</h3>

      <p>
        🌍 ${escapeHtml(brand.country)}
        (${escapeHtml(brand.country_code)})
      </p>

      <p>
        📂 ${escapeHtml(brand.category || "No category")}
      </p>

      <p>
        ${escapeHtml(brand.description || "")}
      </p>

      <p>
        🔗 ${escapeHtml(brand.website || "No website")}
      </p>

      <p>
        ✅ ${escapeHtml(brand.verification || "Unverified")}
      </p>

      <button
        class="danger"
        onclick="deleteBrand(${brand.id})"
      >
        🗑️ Delete
      </button>
    `;

    container.appendChild(div);

  });
}

// ================= SEARCH =================

function filterBrands() {

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    allBrands.filter(brand => {

      return (
        brand.name.toLowerCase().includes(query) ||
        (brand.country || "")
          .toLowerCase()
          .includes(query) ||
        (brand.category || "")
          .toLowerCase()
          .includes(query)
      );

    });

  displayBrands(filtered);
}

// ================= ADD BRAND =================

async function addBrand() {

  const data = {

    name:
      document
        .getElementById("brandName")
        .value
        .trim(),

    country_code:
      document
        .getElementById("countryCode")
        .value
        .trim()
        .toUpperCase(),

    category:
      document
        .getElementById("category")
        .value
        .trim(),

    description:
      document
        .getElementById("description")
        .value
        .trim(),

    website:
      document
        .getElementById("website")
        .value
        .trim(),

    verification:
      document
        .getElementById("verification")
        .value

  };

  if (!data.name) {

    showMessage(
      "Brand name is required.",
      "error"
    );

    return;
  }

  if (!data.country_code) {

    showMessage(
      "Country code is required.",
      "error"
    );

    return;
  }

  try {

    const response =
      await fetch(
        "/api/admin/brands",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );

    const result =
      await response.json();

    if (!response.ok) {

      throw new Error(
        result.error ||
        "Failed to add brand"
      );

    }

    showMessage(
      "✅ Brand added successfully!",
      "success"
    );

    document.getElementById("brandName").value = "";
    document.getElementById("countryCode").value = "";
    document.getElementById("category").value = "";
    document.getElementById("description").value = "";
    document.getElementById("website").value = "";

    loadBrands();

  } catch (error) {

    showMessage(
      "❌ " + error.message,
      "error"
    );

  }
}

// ================= DELETE BRAND =================

async function deleteBrand(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this brand?"
    );

  if (!confirmed) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/admin/brands/" + id,
        {
          method: "DELETE"
        }
      );

    const result =
      await response.json();

    if (!response.ok) {

      throw new Error(
        result.error ||
        "Delete failed"
      );

    }

    showMessage(
      "✅ Brand deleted.",
      "success"
    );

    loadBrands();

  } catch (error) {

    showMessage(
      "❌ " + error.message,
      "error"
    );

  }
}

// ================= APPLICATIONS =================

async function loadApplications() {

  const container =
    document.getElementById("applications");

  container.innerHTML = "Loading...";

  try {

    const response =
      await fetch(
        "/api/admin/applications"
      );

    if (!response.ok) {
      throw new Error(
        "Failed to load applications"
      );
    }

    const applications =
      await response.json();

    document.getElementById(
      "applicationCount"
    ).textContent =
      applications.length;

    if (!applications.length) {

      container.innerHTML =
        "<p>No applications yet.</p>";

      return;
    }

    container.innerHTML = "";

    applications.forEach(app => {

      const div =
        document.createElement("div");

      div.className = "brand";

      div.innerHTML = `
        <h3>${escapeHtml(app.brand_name)}</h3>

        <p>🌍 ${escapeHtml(app.country)}</p>

        <p>📧 ${escapeHtml(app.owner_email)}</p>

        <p>🔗 ${escapeHtml(app.website || "No website")}</p>

        <p>📦 ${escapeHtml(app.package || "Basic")}</p>

        <p>📌 Status: ${escapeHtml(app.status || "pending")}</p>

        <p>🕒 ${escapeHtml(app.created_at || "")}</p>
      `;

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      "<p>❌ Could not load applications.</p>";

    console.error(error);

  }
}

// ================= SECURITY =================

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

// ================= START =================

loadCountries();
loadBrands();
loadApplications();

</script>

</body>
</html>
